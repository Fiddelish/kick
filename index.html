<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <meta name="description" content="Kickbot- och Streamlabs-alerts med Kick-chatten i samma mobilvy." />
    <title>SC1Simon Live Hub</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/socket.io.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="mobile-stage">
      <section class="alerts-panel" aria-label="Alertområde">
        <div class="source-panel kickbot-panel">
          <div class="source-label">Kickbot</div>
          <iframe
            id="kickbot-frame"
            class="widget-frame"
            src="about:blank"
            title="Kickbot tipping alerts"
            allow="autoplay"
          ></iframe>
        </div>

        <div class="source-panel streamlabs-panel">
          <div class="streamlabs-toolbar">
            <span id="connection-dot" class="connection-dot"></span>
            <span id="connection-status">Streamlabs väntar</span>
            <button id="test-alert" class="toolbar-button" type="button">Test</button>
            <button id="open-settings" class="toolbar-button secondary" type="button">Nycklar</button>
          </div>

          <div id="streamlabs-alert" class="streamlabs-alert" aria-live="assertive" hidden>
            <div id="alert-media" class="alert-media" aria-hidden="true"></div>
            <div class="alert-copy">
              <div id="alert-type" class="alert-type"></div>
              <div id="alert-title" class="alert-title"></div>
              <div id="alert-message" class="alert-message"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="chat-panel" aria-label="Kick-chatt">
        <iframe
          class="chat-frame"
          src="https://kick.com/popout/sc1simon/chat"
          title="Kick-chatt för sc1simon"
          allow="autoplay; clipboard-write"
        ></iframe>
      </section>
    </main>

    <div id="start-gate" class="start-gate">
      <form id="start-form" class="start-card">
        <span class="start-dot"></span>
        <h1>SC1Simon Live Hub</h1>
        <p>Klistra in widget-adresserna första gången. De sparas bara på den här enheten.</p>

        <label for="kickbot-url">Kickbot widget-adress</label>
        <input id="kickbot-url" type="password" inputmode="url" autocomplete="off" required />

        <label for="streamlabs-url">Streamlabs anslutningsadress</label>
        <input id="streamlabs-url" type="password" inputmode="url" autocomplete="off" required />

        <div id="form-error" class="form-error" role="alert"></div>
        <button id="start-alerts" type="submit">Starta alerts</button>
      </form>
    </div>

    <noscript>JavaScript måste vara aktiverat för att alerts ska fungera.</noscript>
  </body>
</html>
